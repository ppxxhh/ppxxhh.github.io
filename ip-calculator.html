<div class="main"><div class="main-head"><h1>IP地址计算器</h1><p>根据IP和掩码计算网络地址、广播地址、网关、可用IP范围，支持批量导出，原版核心工具</p></div><div class="main-body">
<div style="display:flex;gap:8px;flex-wrap:wrap"><input id="ip" class="input" style="flex:1" value="192.168.1.10"><input id="mask" class="input" style="flex:1" value="/24"><button class="btn" onclick="calc()">计算</button></div>
<div style="margin-top:10px"><button class="btn btn-sec" onclick="setMask('/24')">/24</button> <button class="btn btn-sec" onclick="setMask('/25')">/25</button> <button class="btn btn-sec" onclick="setMask('/26')">/26</button> <button class="btn btn-sec" onclick="setMask('/27')">/27</button> <button class="btn btn-sec" onclick="setMask('/28')">/28</button> <button class="btn btn-sec" onclick="setMask('/29')">/29</button> <button class="btn btn-sec" onclick="setMask('/30')">/30</button></div>
<div id="out" class="grid" style="margin-top:12px"></div><div id="iplist"></div>
<script>
function ipToInt(ip){return ip.split('.').reduce((a,b)=> (a<<8)+parseInt(b),0)>>>0}
function intToIp(i){return [(i>>>24)&255,(i>>>16)&255,(i>>>8)&255,i&255].join('.')}
function maskToInt(s){s=s.trim();if(s.startsWith('/')){let n=parseInt(s.slice(1));return n==0?0:(0xffffffff << (32-n))>>>0}if(!isNaN(s)){let n=parseInt(s);if(n>=0&&n<=32)return n==0?0:(0xffffffff << (32-n))>>>0}if(s.split('.').length==4)return ipToInt(s);return null}
function setMask(m){document.getElementById('mask').value=m;calc()}
function calc(){let ip=ipToInt(document.getElementById('ip').value.trim());let mask=maskToInt(document.getElementById('mask').value.trim());if(mask===null){alert('掩码错误');return}let net=(ip&mask)>>>0;let bro=(net|(~mask>>>0))>>>0;let first=(bro-net>1)?(net+1)>>>0:net;let last=(bro-net>1)?(bro-1)>>>0:bro;let total=(bro-net+1)>>>0;let usable=total>2?total-2:total;let html='';function row(k,v){return '<div class="result"><div style="color:#64748b;font-size:11px">'+k+'</div><b style="font-size:15px">'+v+'</b></div>'}html+=row('网络地址',intToIp(net));html+=row('广播地址',intToIp(bro));html+=row('网关',intToIp(first));html+=row('可用范围',intToIp(first)+' - '+intToIp(last));html+=row('可用数',usable);html+=row('总IP',total);html+=row('掩码',intToIp(mask));document.getElementById('out').innerHTML=html;let lp=document.getElementById('iplist');if(usable<=200){let s='<div class="result" style="margin-top:10px"><b>可用IP列表</b><div style="max-height:240px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:4px;margin-top:8px">';for(let i=first;i<=last;i++)s+='<div>'+intToIp(i)+'</div>';s+='</div></div>';lp.innerHTML=s}else{lp.innerHTML='<div class="result" style="margin-top:10px">IP过多('+usable+')仅显示头尾各10个</div>'}}calc();
</script>
